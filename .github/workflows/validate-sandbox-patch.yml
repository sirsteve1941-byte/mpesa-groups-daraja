name: Validate sandbox patch

on:
  push:
    branches:
      - sandbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/sandbox-hardening'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check patch applies cleanly
        shell: bash
        run: |
          set -euo pipefail
          test -f sandbox-hardening.patch
          git apply --check sandbox-hardening.patch

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Run unit tests
        run: npm test

