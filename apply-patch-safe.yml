name: Apply sandbox hardening patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Refuse any branch except sandbox-hardening
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" != "sandbox-hardening" ]]; then
            echo "Refusing to run outside sandbox-hardening (selected: $TARGET_BRANCH)."
            exit 1
          fi
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Check and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test -f sandbox-hardening.patch
          git apply --check sandbox-hardening.patch
          git apply sandbox-hardening.patch
          rm -f sandbox-hardening.patch .github/workflows/apply-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit; refusing to create an empty commit."
            exit 1
          fi
          git commit -m "Sandbox hardening: validate and deduplicate payment callbacks"
          git push
