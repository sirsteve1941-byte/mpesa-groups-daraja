name: Install Corrected M-Pesa Project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mpesa-groups-ts-corrected.zip

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract corrected project
        run: |
          set -e

          unzip -q -o mpesa-groups-ts-corrected.zip

          test -d ts

          rm -rf src client test
          rm -f package.json package-lock.json yarn.lock
          rm -f tsconfig.json render.yaml README.md .env.example

          cp -R ts/. .

          rm -rf ts

      - name: Commit corrected project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Deploy corrected M-Pesa Groups project"
          git push
